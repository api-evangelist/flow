name: Flow
description: 'Flow (Flow Engineering, operated by TRC Space Ltd) is a requirements-management
  platform built for hardware and systems engineering teams. It centers on a Systems
  Graph that connects requirements, design artifacts, tests, and components, with AI
  agents that continuously align CAD, simulation, code, and test — automating impact
  analysis, budget tracking, and compliance checking. Flow supports branching and
  merging of requirement baselines, iterative build gates, and an integration ecosystem
  spanning CAD (Onshape, Fusion 360, Siemens NX), simulation (Ansys), and dev tools
  (GitHub, GitLab, Jira, Linear, Slack, Notion, Confluence). It is SOC 2 Type II,
  NIST 800-171, and ITAR/EAR aligned with self-hosted and AWS GovCloud options. A
  first-party API exists (referenced in the changelog) but is gated behind login with
  no publicly published OpenAPI or developer documentation.'
